[package]
name = "openthievius-launcher"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Desktop launcher for OpenThievius"
default-run = "openthievius-launcher"

[dependencies]
anyhow = "1"
gpui = "0.2.2"
dirs = "5"
sha1 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2.5"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[dev-dependencies]
tempfile = "3"
