name: Checks

# Checks that need neither a disc nor a toolchain: the tools' tests, the
# generated tables and the no-game-data check.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: No game data, licence headers, tables current
        run: python tests/check_repository.py
      - name: Compile tools
        run: python -m compileall -q tools tests
