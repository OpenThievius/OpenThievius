name: Checks

# Build the launcher package and run the repository's no-disc checks.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  launcher:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: OpenThievius/sly1-decomp
          path: sly1-decomp
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Install GPUI Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libfontconfig1-dev \
            libfreetype-dev \
            libvulkan-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            squashfs-tools
      - name: Build AppImage
        run: launcher/packaging/build-appimage.sh
        env:
          OPENTHIEVIUS_SOURCE_SLY1: ${{ github.workspace }}/sly1-decomp
      - uses: actions/upload-artifact@v4
        with:
          name: openthievius-launcher-appimage
          path: launcher/target/appimage/dist/*.AppImage

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: No game data, licence headers, tables current
        run: python tests/check_repository.py
      - name: Compile tools
        run: python -m compileall -q tools tests
